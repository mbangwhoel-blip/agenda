name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, mbstring, intl, zip, gd, curl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: PHP Syntax Check
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Setup MySQL
        uses: mirromutth/mysql-action@v1.1
        with:
          mysql database: agenda_pimpinan_test
          mysql user: test
          mysql password: test

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h 127.0.0.1 -u test -ptest --silent; do
            sleep 1
          done

      - name: Run PHPUnit
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: agenda_pimpinan_test
          DB_USER: test
          DB_PASS: test
        run: vendor/bin/phpunit --configuration phpunit.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Security audit (composer)
        run: composer audit

      - name: Check for hardcoded secrets
        run: |
          ! grep -rE "(re_[a-zA-Z0-9]{20,}|bbppvrpsala3|GMAIL_APP_PASSWORD)" --include="*.php" . | grep -v vendor | grep -v ".env.example"
